<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>限界素因数分解</title>
</head>
<body>
  <h1>限界素因数分解</h1>
  <input type="number" id="numberInput" placeholder="数値を入力してください">
  <button id="factorButton">素因数分解</button>
  <div id="result"></div>
  <script>
    document.getElementById('factorButton').addEventListener('click', function() {
      const number = parseInt(document.getElementById('numberInput').value);
      if (isNaN(number) || number < 2) {
        document.getElementById('result').innerText = '2以上の整数なｗｗｗｗ';
        return;
    }
    
    const factors = [];
    let n = number;
    
    for (let i = 2; i <= Math.sqrt(n); i++) {
      while (n % i === 0) {
        factors.push(i);
        n /= i;
      }
    }
    
    if (n > 1) {
      factors.push(n);
    }
    
    document.getElementById('result').innerText = `素因数分解結果: ${factors.join(' × ')}`;
  });
</script>

</body>
</html>
